# Optional. The backend runs fine without this — Kafka is off by default.
# To use it: `docker compose up -d`, then start the backend with the
# environment variable KAFKA_ENABLED=true, e.g. in PowerShell:
#   $env:KAFKA_ENABLED="true"; mvn spring-boot:run
# (see README "Optional: Kafka"). NotificationListener then logs each claim
# event and sends a simulated SMS for it.
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: chubb-claims-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
